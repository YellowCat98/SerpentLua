name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS arm64
          os: macos-latest
          combine: 'false'
          artifact: mac-arm64

        - name: macOS x86_64
          os: macos-26-intel
          combine: 'false'
          artifact: mac-x86_64

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Get 32-bit headers (fuck android32????????)
        if: matrix.config.target == 'Android32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: ${{ matrix.config.combine != 'false' }}
          target: ${{ matrix.config.target }}
        env:
          CC: clang
          CXX: clang++

      - name: Upload macOS artifacts separately
        if: matrix.config.combine == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: geode-build-${{ matrix.config.artifact }}
          path: ${{ steps.build.outputs.build-output }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:

      - name: Get macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: geode-build-mac-*
          path: artifacts

      - name: Unzip .geode packages
        working-directory: artifacts
        run: |
          unzip geode-build-mac-arm64/yellowcat98.serpentlua.geode -d ./serpentlua-arm64
          unzip geode-build-mac-x86_64/yellowcat98.serpentlua.geode -d ./serpentlua-x86_64

      - name: Merge macOS dylibs
        working-directory: artifacts
        run: |
          llvm-lipo -create -output ./fat-serpentlua.dylib ./serpentlua-arm64/yellowcat98.serpentlua.dylib ./serpentlua-x86_64/yellowcat98.serpentlua.dylib
          mv fat-serpentlua.dylib ./serpentlua-arm64/yellowcat98.serpentlua.dylib

      - name: Repackage macOS Geode mod
        working-directory: artifacts/serpentlua-arm64
        run: zip -r ../yellowcat98.serpentlua.geode *

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

